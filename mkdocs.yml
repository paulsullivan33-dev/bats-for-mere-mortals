site_name: Bats for Mere Mortals
site_description: A test framework for Bash scripts. Writing test files that state what a script should do, running them with one command, and reading a report that says pass, fail, or skip for every claim, with the exit code a build server can act on, and the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/bats-for-mere-mortals/
